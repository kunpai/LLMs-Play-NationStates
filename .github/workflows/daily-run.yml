name: Daily NationStates Check

permissions:
  contents: write  # Allow pushing changes back to the repository

on:
  schedule:
    # Run daily at 12:00 UTC (adjust timezone as needed)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow pushing changes back to the repository

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Ollama
      run: |
        curl -fsSL https://ollama.com/install.sh | sh

    - name: Ensure Ollama API is available
      run: |
        if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
          ollama serve >/tmp/ollama.log 2>&1 &
        fi

        timeout_seconds=30
        ready=false
        for _ in $(seq 1 "$timeout_seconds"); do
          if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
            ready=true
            break
          fi
          sleep 1
        done

        if [ "$ready" != "true" ]; then
          echo "Timeout: Ollama API did not become available after ${timeout_seconds} seconds."
          if [ -f /tmp/ollama.log ]; then
            echo "Ollama startup logs:"
            cat /tmp/ollama.log
          fi
          exit 1
        fi

    - name: Pull Llama model
      run: |
        ollama pull llama3.2:3b

    - name: Run NationStates script
      env:
        NATION: ${{ secrets.NATION }}
        PASSWORD: ${{ secrets.PASSWORD }}
        USER_AGENT: ${{ secrets.USER_AGENT }}
        SLEEP_BETWEEN_REQUESTS: 10
        TEST_MODE: false
        SINGLE_RUN: true
      run: |
        python main.py

    - name: Commit and push updated choices
      run: |
        if [ -f choices.ndjson ] && git diff --quiet choices.ndjson; then
          echo "No changes to choices.ndjson"
        else
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add choices.ndjson
          git commit -m "Update choices.ndjson from daily automated run" || echo "No changes to commit"
          git push
        fi